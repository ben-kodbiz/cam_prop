[project]
name = "open-evidence"
version = "0.1.0"
description = "Open-source, evidence-first documentation of contested claims, international-law records and corporate relationships."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
pdf = [
    "beautifulsoup4>=4.12",
    "PyMuPDF>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "ingestion", "agents", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings (e.g. quotes in claim text)
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["app", "ingestion", "agents"]
strict = true
warn_unreachable = true
# feedparser ships stubs in types-feedparser? no: untyped upstream
[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz"]
ignore_missing_imports = true

# pdf.py straddles two environments (pymupdf installed or not); its inline
# ignores are needed in exactly one of the two states, so allow the unused
# ones rather than pinning the file to a single environment.
[[tool.mypy.overrides]]
module = "ingestion.pdf"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
